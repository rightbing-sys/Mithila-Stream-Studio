name: video_editor
description: A CapCut-style AI video editor Flutter application with precision timeline trimming, music mixing, overlays, 9:16/16:9 export, and gallery save.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  video_player: ^2.9.2
  file_picker: ^8.1.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  ffmpeg_kit_flutter_new: ^4.6.8
  path_provider: ^2.1.4
  gal: ^2.3.0
  share_plus: ^10.0.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/banner.png
    - assets/icon/app_icon.png
